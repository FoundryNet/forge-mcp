# Secret scanning for a repository GitHub will not scan for us.
#
# Push protection and secret scanning need GitHub Advanced Security, which is not
# available on these repos. Without this workflow a credential committed here is
# caught by nobody. Added 2026-10-09, after an audit found this repo had NEVER been
# secret-scanned in any form -- the control existed in forge-prod and
# forge-federation only, so five repositories, two of them public, had no coverage
# at all.
name: secret-scan

# `push` is scoped to main, `pull_request` is NOT scoped -- deliberately. GitHub
# bills each job rounded UP to a whole minute, so a 12-second scan costs a full
# minute and RUN COUNT dominates, not wall time; scanning every branch push made
# this the second most expensive workflow in the account. Scoping `push` to main
# loses no coverage, because every line is still scanned on its pull_request
# before it can merge.
#
# There is deliberately NO `paths` filter. A docs-only change is exactly where a
# pasted credential hides.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # so a full history scan can be run on demand
  schedule:
    - cron: "17 4 * * 1"    # weekly, Mondays 04:17 UTC

defaults:
  run:
    shell: bash -euo pipefail {0}

# Superseding a scan in flight is safe: the newer run scans a superset of what the
# older one was looking at.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is load-bearing, not boilerplate. On a pull_request event
# gitleaks-action calls ScanPullRequest, which lists the PR's commits through the
# API before it scans anything. With the default token permissions that call
# returns 403 "Resource not accessible by integration" and the action CRASHES --
# a red job that never scanned a single byte, which reads exactly like a finding
# and is not one. Observed on forge-prod PR #5, 2026-09-27.
permissions:
  contents: read
  pull-requests: read

# RUNNER IS PINNED. `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19 and GitHub
# warns about it on every run. A gate whose base image changes underneath it is
# exactly the drift a gate exists to catch.
jobs:
  # INCREMENTAL. gitleaks-action scans only the pushed diff on a push event -- it
  # passes --log-opts=-1 regardless of fetch-depth. That is the right default for
  # speed, but it is NOT a history scan, and believing otherwise is how a secret
  # already in history goes unnoticed for ever.
  incremental:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          # Posting a PR comment would need pull-requests: WRITE, which a
          # fork-originated PR never gets. The job summary carries the finding
          # either way.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # FULL HISTORY. Every commit, every blob, on a schedule and on demand. This is
  # the half that catches what was committed before the scanner existed.
  full-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: scan every commit
        run: |
          curl -sSfL -o /tmp/gl.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
