# This directory sits inside an ancestor Python package tree
# (../__init__.py and ../../__init__.py exist), so without an ini file here
# pytest resolves rootdir to .../mint4.0, derives a dotted module name through
# those ancestor packages, and collection dies on their relative imports.
# This file pins rootdir to the repo root; `.` on sys.path is what lets the
# tests `import gating` / `import mcp_server` the same way the server does.
[pytest]
testpaths = tests
pythonpath = .
